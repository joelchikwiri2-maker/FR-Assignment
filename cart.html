<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bean Boutique - Coffee Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <header class="site-header">
            <h1 class="header-title">Welcome to the Bean Boutique</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li class="dropdown">
                        <a href="shop.html">Shop</a>
                        <ul class="dropdown-menu">
                            <li><a href="shop.html#coffee-section">Coffee Beans</a></li>
                            <li><a href="shop.html#brew-section">Brewing Equipment</a></li>
                        </ul>
                    </li>
                    <li><a href="events.html">Events & Workshops</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li>
                        <a href="cart.html" class="cart-link">
                            <img src="icons/cart.png" alt="Cart">
                            <span class="cart-badge">0</span>
                        </a>
                    </li>
                </ul>

                <form id="shop-search-form" class="nav-search">
                    <input type="text" id="shop-search" placeholder="Search products..." autocomplete="off">
                </form>
            </nav>
        </header>

        <main>
            <section class="cart-section">
                <h2 class="feature-header">Your Cart</h2>
        
                <div id="cart-empty" class="cart-empty">
                    <p>Your cart is empty.</p>
                    <a href="shop.html" class="feature-button">Browse Coffee</a>
                </div>
        
                <table class="cart-table" id="cart-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Total</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cart-table-body"></tbody>
                </table>
        
                <div class="cart-cards" id="cart-cards-container"></div>
        
                <div class="cart-summary" id="cart-summary">
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="cart-subtotal">$0.00</span>
                    </div>
                    <div class="summary-row summary-total">
                        <span>Total</span>
                        <span id="cart-total">$0.00</span>
                    </div>
                    <button type="button" class="feature-button checkout-btn" onclick="window.location.href='checkout.html'">Checkout</button>
                </div>
            </section>
        </main>

        <footer>&copy;2026 Bean Boutique</footer>

        <script src="script.js"></script>
</body>
</html>
